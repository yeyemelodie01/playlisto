api_platform:
    title: 'Playlisto API'
    version: '1.0.0'
    formats:
        jsonld: ['application/ld+json']
        json:   ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    event_listeners_backward_compatibility_layer: false
    keep_legacy_inflector: false
    use_symfony_listeners: false
    swagger:
        api_keys:
            bearerAuth:
                name: Authorization
                type: header
    graphql:
        enabled: false