security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        administrator_provider:
            entity:
                class: App\Entity\Administrator
                property: email

        user_provider:
            entity:
                class: App\Entity\User
                property: email

        all_users:
            chain:
                providers: [ user_provider, administrator_provider ]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/authentication_token
            stateless: true
            provider: all_users
            json_login:
                check_path: /api/authentication_token
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api/
            stateless: true
            provider: all_users
            jwt: ~

        back_secured_area:
            host: '%back_domain_default%'
            provider: administrator_provider
            logout:
                path: logout
                target: login
            switch_user: true
            access_denied_handler: App\Security\Handler\AccessDeniedHandler
            custom_authenticator: App\Security\Authentication\LoginFormAuthenticator
            stateless: false


    access_control:
        - { route: login, roles: PUBLIC_ACCESS }
        - { route: logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/authentication_token, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/signup, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY}
        - { path: ^/, roles: ROLE_ADMIN, host: '%back_domain_default%' }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
